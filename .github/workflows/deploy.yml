name: Deploy

on:
  push:
    branches: [main, homolog]

permissions:
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required secrets
        id: check
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && \
             [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && \
             [ -n "${{ secrets.APP_BASE_URL }}" ] && \
             [ -n "${{ secrets.LAMBDA_INTERNAL_API_KEY }}" ] && \
             [ -n "${{ secrets.JWT_PRIVATE_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-secrets
    runs-on: ubuntu-latest
    if: needs.check-secrets.outputs.ready == 'true'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_app_base_url: ${{ secrets.APP_BASE_URL }}
      TF_VAR_internal_api_key: ${{ secrets.LAMBDA_INTERNAL_API_KEY }}
      TF_VAR_jwt_private_key: ${{ secrets.JWT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # ATENÇÃO: sem backend remoto configurado (mesma lacuna documentada
      # em 15SOAT-Fase1/docs/architecture/rfcs/rfc-002-managed-database-strategy.md
      # pros módulos Dokploy) — state local ao runner efêmero, não
      # sobrevive entre runs. Não usar repetidamente sem configurar um
      # backend remoto antes (aqui, um backend S3 seria natural — já é
      # AWS — mas não provisionado nesta sessão).
      - name: terraform init
        run: terraform init

      - name: terraform apply
        run: terraform apply -auto-approve

      - name: Print API endpoint
        run: terraform output api_endpoint
